name: Inspect INE Portuguese occupation wages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-ine-pt-occupation-wages
  cancel-in-progress: false
jobs:
  inspect-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-inspection dependency
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Read official INE 0010385 and list dimensions and CPP categories
        run: python -m app.pt_occupation_wages --fetch --inspect
