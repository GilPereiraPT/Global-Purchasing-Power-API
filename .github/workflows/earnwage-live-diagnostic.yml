name: EarnWage live API temporary diagnostic
on:
  push:
    branches: [diagnostic/earnwage-live-api]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe published GitHub Pages website and API
        shell: bash
        run: |
          python - <<'PYCODE'
          import concurrent.futures, json, urllib.request, urllib.error
          host='https://earnwage-api.policlinicosdesantoandre.com'
          pages='https://gilpereirapt.github.io/Global-Purchasing-Power-API/'
          origin='https://gilpereirapt.github.io'
          paths=['/v1/health','/v1/countries','/v1/occupations?lang=pt',
            '/v1/countries/PT','/v1/economy/compare?country_a=PT&country_b=PT',
            '/v1/earnwage/overview?country=PT&occupation=accountant',
            '/v1/earnwage/compare?country_a=PT&country_b=ES&occupation=accountant&annual_gross_a=30000',
            '/v1/economy/coverage','/v1/economy/history/PT?indicator=inflation_annual',
            '/v1/sources','/v1/tax/assumptions/PT','/v1/regions/US',
            '/v1/jobs?country=PT&occupation=accountant&limit=1',
            '/v1/pt/earnings/groups','/v1/in/plfs/earnings']
          urls=[pages,pages+'country.html?country=PT',pages+'api-config.js']+[host+p for p in paths]
          def check(url):
            req=urllib.request.Request(url,headers={'Origin':origin,'Accept':'application/json' if url.startswith(host) else 'text/html'})
            try:
              with urllib.request.urlopen(req,timeout=18) as r:
                body=r.read(1500).decode('utf-8','replace')
                return {'url':url,'http':r.status,'content_type':r.headers.get('Content-Type'),
                  'cors':r.headers.get('Access-Control-Allow-Origin'),'sample':body[:270]}
            except urllib.error.HTTPError as e:
              body=e.read(500).decode('utf-8','replace')
              return {'url':url,'http':e.code,'cors':e.headers.get('Access-Control-Allow-Origin'),'sample':body[:270]}
            except Exception as e:return {'url':url,'error':type(e).__name__+': '+str(e)[:250]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for r in pool.map(check,urls):print(json.dumps(r,ensure_ascii=False),flush=True)
          PYCODE
      - name: Inspect functional website flows in real browser
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
          node - <<'JSCODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const root='https://gilpereirapt.github.io/Global-Purchasing-Power-API/';
            const routes=[
              {path:'',button:'#compareBtn',result:'#comparisonContent'},
              {path:'compare.html',button:'#submit',result:'#results'},
              {path:'salaries.html',button:'#exploreForm button[type=submit]',result:'#results'},
              {path:'countries.html',button:'#exploreForm button[type=submit]',result:'#results'},
              {path:'country.html?country=PT',button:'#refresh',result:'#detailsResults'},
              {path:'occupation.html?country=PT&occupation=accountant',button:'#refresh',result:'#detailsResults'},
              {path:'coverage.html',button:'#load',result:'#results'},
              {path:'history.html?country=PT',button:'#load',result:'#results'},
              {path:'wage-groups.html?country=PK',button:'#load',result:'#results'},
              {path:'source-directory.html',button:null,result:'#results'},
              {path:'jobs.html',button:'#exploreForm button[type=submit]',result:'#results'}
            ];
            for(const item of routes){
              const page=await browser.newPage({viewport:{width:1280,height:900}});
              const issues=[],calls=[];
              page.on('pageerror',e=>issues.push('PAGEERROR '+String(e.message).slice(0,220)));
              page.on('console',m=>{if(m.type()==='error')issues.push('CONSOLE '+m.text().slice(0,180));});
              page.on('response',r=>{if(r.url().includes('/v1/'))calls.push({status:r.status(),url:r.url().split('/v1/')[1]?.slice(0,120)})});
              try{
                await page.goto(root+item.path,{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForTimeout(2100);
                if(item.button&&await page.locator(item.button).count()){
                  await page.locator(item.button).first().click({timeout:8000});
                  await page.waitForTimeout(1900);
                }
                let data=await page.evaluate((id)=>{
                  const n=document.querySelector(id);
                  return {text:n?.innerText?.slice(0,900)||'',hidden:n?.hidden??null};
                },item.result);
                console.log(JSON.stringify({page:item.path||'HOME',title:await page.title(),data,apiCalls:calls,issues},null,0));
              }catch(e){
                console.log(JSON.stringify({page:item.path||'HOME',exception:String(e).slice(0,500),calls,issues}));
              }finally{await page.close()}
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JSCODE
      - name: Inspect safe deployment enablement flag
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.EARNWAGE_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "EARNWAGE_PRODUCTION_DEPLOY=ENABLED"
          else
            echo "EARNWAGE_PRODUCTION_DEPLOY=DISABLED"
          fi
