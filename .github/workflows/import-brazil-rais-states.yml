name: Import Brazil 2025 regional RAIS wages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-brazil-rais-states.yml'
permissions:
  contents: read
concurrency:
  group: earnwage-brazil-rais-states
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import published state medians and audit every CBO code
        run: |
          python -m pip install requests beautifulsoup4
          python -m app.br_rais_states_import --output data/br_rais_2025_states.json
      - name: Validate and inspect actual coverage
        run: |
          python - <<'PY'
          from app.br_rais_states import load, coverage
          count=load()
          c=coverage()
          print(c)
          assert count>=100 and c["states_with_data"]>=10
          assert c["observed_occupations"]>=20
          PY
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-brazil-rais-states
          path: data/br_rais_2025_states.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [import]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-brazil-rais-states
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/br_rais_2025_states.json
