name: Prepare verified ILOSTAT major-group salary snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::Rilostat
      - name: Download official observations
        run: Rscript scripts/ilostat_export_groups.R
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and prepare group salary snapshot
        run: |
          python -m app.ilostat_groups diagnostics/ilostat_groups_raw.csv --output diagnostics/ilostat_group_salaries.json
          python -m pytest -q
      - name: Upload for review, without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilostat-major-group-salaries-review
          path: |
            diagnostics/ilostat_groups_raw.csv
            diagnostics/ilostat_group_salaries.json
          if-no-files-found: ignore
