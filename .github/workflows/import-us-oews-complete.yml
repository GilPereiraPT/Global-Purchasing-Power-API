name: Import complete official US OEWS wages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-us-oews-complete.yml'
      - 'tests/test_earnwage_queries.py'
      - 'app/us_oews_snapshot.py'
permissions:
  contents: read
concurrency:
  group: us-oews-curated-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Import source OEWS May 2025 all-data release
        env:
          GPP_CACHE_DB: ${{ runner.temp }}/oews-full.sqlite3
        run: |
          python -m app.us_oews --download --year 2025
          python -m app.us_oews_snapshot --export
          python -m app.us_oews_snapshot --load
          python - <<'PY'
          from app.us_oews import coverage
          from app.us_oews_snapshot import export_snapshot
          print("Official full release:", coverage())
          print("Published curated subset:", export_snapshot())
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-us-oews-complete
          path: data/us_oews_curated.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [import]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-us-oews-complete
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/us_oews_curated.json
