name: Import free Canadian occupational wages
# Expanded official NOC mapping: refresh the versioned snapshot (38 audited roles, including shared NOC groups).
on:
  push:
    paths:
      - '.github/workflows/import-canada-wages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: north-america-wage-import
  cancel-in-progress: false
jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Import official Canada Job Bank file
        env:
          GPP_CACHE_DB: ${{ runner.temp }}/north_america.sqlite3
        run: |
          python -c "from app.north_america import load_snapshot; load_snapshot('data/north_america_wages.json')"
          python -m app.north_america --canada
          python -m app.north_america --export
          # Validate the freshly generated snapshot before committing it.
          python -c "from app.north_america import load_snapshot, observed_coverage; load_snapshot('data/north_america_wages.json'); c=observed_coverage(); ca={occupation for (country, occupation) in c if country == 'CA'}; assert len(ca) == 38, sorted(ca)"
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-canada-wages
          path: data/north_america_wages.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [canada]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-canada-wages
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/north_america_wages.json
