name: Import Canada broad occupational groups
# Parser refresh: broad aggregates selected by official StatCan NOC bracket ranges.

on:
  push:
    paths:
      - '.github/workflows/import-canada-groups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official Statistics Canada table
        run: curl --fail --location --retry 3 -o "$RUNNER_TEMP/statcan.zip" "https://www150.statcan.gc.ca/n1/en/tbl/csv/14100417-eng.zip"
      - name: Inspect official Statistics Canada schema
        run: |
          python - <<'PY'
          import csv, io, os, zipfile
          z=zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "statcan.zip"))
          names=[n for n in z.namelist() if n.lower().endswith(".csv") and "metadata" not in n.lower()]
          name=max(names,key=lambda n:z.getinfo(n).file_size)
          r=csv.DictReader(io.TextIOWrapper(z.open(name),encoding="utf-8-sig"))
          print("FIELDS:", r.fieldnames)
          seen={k:set() for k in ["REF_DATE","GEO","Wages","Type of work","Gender","Age group"]}
          noc=next((x for x in r.fieldnames if x.startswith("National Occupational Classification")),None)
          samples=[]
          for i,row in enumerate(r):
            for k in seen:
              if len(seen[k])<12: seen[k].add(row.get(k,""))
            if noc and len(samples)<20 and row.get("REF_DATE")=="2025":
              samples.append(row.get(noc,""))
            if i>3000000: break
          print("VALUES:", {k:sorted(v) for k,v in seen.items()})
          print("NOC SAMPLES:", samples)
          PY
      - name: Build and validate broad NOC snapshot
        run: |
          python -m app.ca_statcan_groups "$RUNNER_TEMP/statcan.zip"
          python -c "from app.ca_statcan_groups import load_snapshot; rows=load_snapshot(); groups={r['noc2021_broad_category'] for r in rows}; assert groups == set('0123456789'), groups"
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-canada-groups
          path: data/ca_statcan_groups.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [import]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-canada-groups
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/ca_statcan_groups.json
