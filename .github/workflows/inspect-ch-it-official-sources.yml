name: Inspect CH and IT official wage source granularity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ch-it-official-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Swiss BFS PXWeb occupation granularity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://www.pxweb.bfs.admin.ch/api/v1/en/px-x-0304010000_205/px-x-0304010000_205.px"
          req=urllib.request.Request(url,headers={"User-Agent":"EarnWage/1.0"})
          with urllib.request.urlopen(req,timeout=45) as r:
              obj=json.load(r)
          print("CH_TITLE",obj.get("title"))
          for v in obj.get("variables",[]):
              vals=v.get("values",[])
              labels=v.get("valueTexts",[])
              print("CH_VAR",v.get("code"),v.get("text"),"N",len(vals))
              if "prof" in (v.get("text") or "").lower() or "occup" in (v.get("text") or "").lower():
                  for code,label in list(zip(vals,labels))[:120]:
                      print("CH_OCC",code,label)
          PY

      - name: Inspect ISTAT RACLI SDMX structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, xml.etree.ElementTree as ET
          base="https://esploradati.istat.it/SDMXWS/rest"
          headers={"User-Agent":"EarnWage/1.0","Accept":"application/vnd.sdmx.structure+xml;version=2.1"}
          flow_url=base+"/dataflow/IT1/DCSC_RACLI/latest?references=all"
          req=urllib.request.Request(flow_url,headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r:
              payload=r.read()
          print("IT_FLOW_BYTES",len(payload))
          root=ET.fromstring(payload)
          refs=[]
          for el in root.iter():
              if el.tag.endswith("Ref"):
                  a=el.attrib
                  if a.get("class")=="DataStructure" or a.get("package")=="datastructure":
                      refs.append(dict(a))
          print("IT_DSD_REFS",refs[:10])
          text=payload.decode("utf-8","replace")
          for pat in ("PROF","OCCUP","QUALIF","ISCO","CP2011","CP2021"):
              hits=[m.start() for m in re.finditer(pat,text,re.I)]
              print("IT_PATTERN",pat,"COUNT",len(hits))
              for pos in hits[:6]:
                  print("IT_SNIP",re.sub(r"\\s+"," ",text[max(0,pos-180):pos+360]))
          PY
