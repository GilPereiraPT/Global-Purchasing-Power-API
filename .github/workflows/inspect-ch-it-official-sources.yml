name: Inspect CH and IT official wage source granularity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ch-it-official-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect ISTAT RACLI SDMX structure
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import re, urllib.request, urllib.error, xml.etree.ElementTree as ET
          base="https://esploradati.istat.it/SDMXWS/rest"
          headers={"User-Agent":"EarnWage/1.0","Accept":"application/vnd.sdmx.structure+xml;version=2.1"}
          urls=[
              base+"/dataflow/IT1/DCSC_RACLI/latest?references=all",
              base+"/dataflow/IT1/DCSC_RACLI/1.0?references=all",
          ]
          payload=None
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r:
                      payload=r.read()
                  print("IT_SDMX_OK",url,"BYTES",len(payload))
                  break
              except Exception as e:
                  print("IT_SDMX_FAIL",url,repr(e))
          if not payload:
              raise SystemExit("No ISTAT RACLI SDMX structure response")
          root=ET.fromstring(payload)
          refs=[]
          for el in root.iter():
              if el.tag.endswith("Ref"):
                  a=el.attrib
                  if a.get("class")=="DataStructure" or a.get("package")=="datastructure":
                      refs.append(dict(a))
          print("IT_DSD_REFS",refs[:20])
          txt=payload.decode("utf-8","replace")
          for pat in ("PROF","OCCUP","QUALIF","ISCO","CP2011","CP2021"):
              hits=[m.start() for m in re.finditer(pat,txt,re.I)]
              print("IT_PATTERN",pat,"COUNT",len(hits))
              for pos in hits[:8]:
                  print("IT_SNIP",re.sub(r"\s+"," ",txt[max(0,pos-180):pos+420]))
          PY

      - name: Inspect official ISTAT 2022 earnings workbook
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import io, re, urllib.request
          from zipfile import ZipFile
          url="https://www.istat.it/wp-content/uploads/2025/01/Tavole_Struttura-delle-retribuzioni_2022.xlsx"
          req=urllib.request.Request(url,headers={"User-Agent":"EarnWage/1.0"})
          with urllib.request.urlopen(req,timeout=90) as r:
              payload=r.read()
          print("IT_XLSX_BYTES",len(payload),payload[:4])
          if not payload.startswith(b"PK"):
              raise SystemExit("ISTAT workbook did not return XLSX")
          import subprocess,sys,tempfile,os
          subprocess.check_call([sys.executable,"-m","pip","install","--quiet","openpyxl"])
          from openpyxl import load_workbook
          wb=load_workbook(io.BytesIO(payload),read_only=True,data_only=True)
          print("IT_SHEETS",wb.sheetnames)
          terms=("profess","occupaz","isco","cp2011","cp2021","qualifica")
          for ws in wb.worksheets:
              print("IT_SHEET",ws.title,"ROWS",ws.max_row,"COLS",ws.max_column)
              found=0
              for ridx,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  vals=["" if v is None else str(v) for v in row]
                  joined=" | ".join(vals)
                  if ridx <= 12:
                      print("IT_TOP",ws.title,ridx,joined[:1800])
                  if any(t in joined.lower() for t in terms):
                      print("IT_TERM",ws.title,ridx,joined[:2400])
                      found += 1
                      if found >= 30:
                          break
          PY

      - name: Probe Swiss BFS PXWeb metadata
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json, urllib.request, urllib.error
          candidates=[
            "https://www.pxweb.bfs.admin.ch/api/v1/en/",
            "https://www.pxweb.bfs.admin.ch/api/v1/en/px-x-0304010000_205/",
            "https://www.pxweb.bfs.admin.ch/api/v1/en/px-x-0304010000_205/-/px-x-0304010000_205.px",
            "https://www.pxweb.bfs.admin.ch/api/v1/en/px-x-0304010000_205/px-x-0304010000_205.px",
          ]
          headers={"User-Agent":"EarnWage/1.0","Accept":"application/json"}
          for url in candidates:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read()
                  print("CH_OK",url,"BYTES",len(body),"HEAD",body[:300])
                  try:
                      obj=json.loads(body)
                      if isinstance(obj,dict):
                          print("CH_TITLE",obj.get("title"))
                          for v in obj.get("variables",[]):
                              vals=v.get("values",[])
                              labels=v.get("valueTexts",[])
                              print("CH_VAR",v.get("code"),v.get("text"),"N",len(vals))
                              if "prof" in (v.get("text") or "").lower() or "occup" in (v.get("text") or "").lower():
                                  for code,label in list(zip(vals,labels))[:150]:
                                      print("CH_OCC",code,label)
                      else:
                          print("CH_LIST",obj[:50])
                  except Exception as e:
                      print("CH_JSON_FAIL",repr(e))
              except urllib.error.HTTPError as e:
                  print("CH_HTTP",url,e.code,e.read()[:500])
              except Exception as e:
                  print("CH_FAIL",url,repr(e))
          PY
