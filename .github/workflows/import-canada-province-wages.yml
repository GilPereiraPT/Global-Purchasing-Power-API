name: Import official Canada province wages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-canada-province-wages.yml'
      - 'app/ca_province_wages.py'
      - 'tests/test_ca_province_wages.py'
permissions:
  contents: read
concurrency:
  group: canadian-province-wages
  cancel-in-progress: false
jobs:
  provincial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch and validate official 2025 Job Bank province totals
        env:
          GPP_CACHE_DB: ${{ runner.temp }}/ca_province.sqlite3
        run: |
          python -m app.ca_province_wages --import-official --export
          python - <<'PY'
          import json
          from app.ca_province_wages import load_snapshot, coverage
          n = load_snapshot("data/ca_province_wages.json")
          c = coverage()
          print(json.dumps(c))
          assert n > 0 and c["occupation_province_pairs"] >= 10, c
          PY
          python -m pytest -q tests/test_ca_province_wages.py tests/test_north_america.py
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-canada-province-wages
          path: data/ca_province_wages.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [provincial]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-canada-province-wages
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/ca_province_wages.json
