name: EarnWage Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'EarnWage_Logo.webp'
      - 'EarnWage_Hero.webp'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install EarnWage branding assets
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp EarnWage_Logo.webp android/app/src/main/res/drawable-nodpi/earnwage_logo.webp
          cp EarnWage_Hero.webp android/app/src/main/res/drawable-nodpi/earnwage_hero.webp
      - name: Build optimized internal test APK and debug baseline
        run: gradle -p android :app:assembleRelease :app:assembleDebug --stacktrace
      - name: Compare APK sizes
        run: |
          ls -lh android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk
          sha256sum android/app/build/outputs/apk/release/*.apk
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android/app/build/outputs/apk")
          for kind in ("release","debug"):
              for apk in (root/kind).glob("*.apk"):
                  print(f"{kind} APK: {apk.stat().st_size/1024/1024:.2f} MiB")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EarnWage-v0.7.0-optimized-test-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: EarnWage-v0.7.0-debug-baseline
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
