name: EarnWage Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'EarnWage_Logo.webp'
      - 'EarnWage_Hero.webp'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install EarnWage branding assets
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp EarnWage_Logo.webp android/app/src/main/res/drawable-nodpi/earnwage_logo.webp
          cp EarnWage_Hero.webp android/app/src/main/res/drawable-nodpi/earnwage_hero.webp
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EarnWage-v0.1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
