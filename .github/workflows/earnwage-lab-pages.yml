name: EarnWage Website and API Lab - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/earnwage-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: earnwage-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website and API Lab scripts
        shell: bash
        run: |
          set -euo pipefail
          find website -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
          python - <<'PY'
          from pathlib import Path
          import re
          for filename in ("index", "india", "brazil", "germany", "portugal"):
              source = Path(f"docs/{filename}.html").read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", source)
              assert scripts, f"No inline API Lab JavaScript: {filename}"
              Path(f"/tmp/earnwage-lab-{filename}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          for file in /tmp/earnwage-lab-*.js; do node --check "$file"; done
      - name: Validate country profiles and meteorology before publishing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest -q \
            tests/test_website_city_time.py \
            tests/test_website_country_politics.py \
            tests/test_website_city_time_compare.py \
            tests/test_website_weather.py \
            tests/test_country_demographics_geography.py \
            tests/test_weather_metno.py
      - name: Assemble GitHub Pages website with separate API Lab
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/lab
          cp -a website/. _site/
          cp -a docs/. _site/lab/
          rm -f _site/_headers
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/lab/index.html
          test -f _site/country-guides.js
          test -f _site/api-config.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          root = Path("_site")
          class Assets(HTMLParser):
              def __init__(self, filename):
                  super().__init__()
                  self.filename = filename
              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  attr = "src" if tag == "script" else "href" if tag == "link" and props.get("rel") == "stylesheet" else None
                  if not attr or not props.get(attr):
                      return
                  url = urlsplit(props[attr])
                  if url.scheme or url.netloc or not url.path:
                      return
                  destination = (self.filename.parent / url.path).resolve()
                  assert destination.is_file() and destination.is_relative_to(root.resolve()), (
                      f"Missing local asset {props[attr]} in {self.filename}")
          for filename in root.glob("*.html"):
              parser = Assets(filename)
              parser.feed(filename.read_text(encoding="utf-8"))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
