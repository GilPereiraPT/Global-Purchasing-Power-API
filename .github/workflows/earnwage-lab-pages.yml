name: EarnWage API Lab Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/earnwage-lab-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earnwage-lab-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check API Lab JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("docs/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", text)
          assert blocks, "No inline API Lab script found"
          Path("/tmp/earnwage-lab.js").write_text("\\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/earnwage-lab.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
