name: Build UK ASHE snapshot once
on:
  push:
    branches:
      - feat/uk-ons-ashe-4digit-20260928
    paths:
      - '.github/workflows/build-uk-snapshot-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/uk-ons-ashe-4digit-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet -r requirements.txt
      - name: Build from corrected official ONS 2025 provisional source
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.ons.gov.uk/file?uri=%2Femploymentandlabourmarket%2Fpeopleinwork%2Fearningsandworkinghours%2Fdatasets%2Foccupation4digitsoc2010ashetable14%2F2025provisional%2Fashetable142025provisional.zip'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 "$url" -o ashe14.zip
          python -m app.uk_ashe_wages --source-zip ashe14.zip --export data/uk_ashe_wages.json
          python - <<'PY'
          import json
          x=json.load(open("data/uk_ashe_wages.json",encoding="utf-8"))
          jobs={r["occupation"] for r in x["records"]}
          assert len(jobs) >= 25
          assert x["preferred_measure"] == "median"
          print("validated occupations:",len(jobs),"records:",len(x["records"]))
          PY
      - name: Commit validated aggregate snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uk_ashe_wages.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "data(uk): add official ONS ASHE 2025 occupation wage snapshot"
          git push origin HEAD:feat/uk-ons-ashe-4digit-20260928
