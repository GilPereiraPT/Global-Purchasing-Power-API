name: Inspect India PLFS public derivative
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-india-plfs-2025.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned public PLFS derivative and inspect only schema
        run: |
          python - <<'PY'
          import urllib.request, hashlib,zipfile,csv,io,os
          url="https://github.com/Vonter/india-plf-survey/releases/download/latest/2025.csv.zip"
          path="/tmp/plfs2025.csv.zip"
          urllib.request.urlretrieve(url,path)
          digest=hashlib.sha256(open(path,"rb").read()).hexdigest()
          print("SHA256:",digest,flush=True)
          assert digest=="a38b88d3d1f84479bfebd9dcd7e9c8771490cf16151bd84aa22128b4796a5ffa"
          with zipfile.ZipFile(path) as z:
              print("MEMBERS:",[(i.filename,i.file_size) for i in z.infolist()],flush=True)
              assert len(z.infolist())==1 and z.infolist()[0].filename=="2025.csv"
              with z.open("2025.csv") as f:
                  r=csv.DictReader(io.TextIOWrapper(f,encoding="utf-8-sig"))
                  print("COLUMNS:",r.fieldnames,flush=True)
                  for i,row in zip(range(2),r):
                      print("SAMPLE NON-IDENTIFYING FIELDS:", {k:row.get(k) for k in
                        ["Survey Year","CWS Status","CWS Occupation","CWS Earnings (Salaried)","Person Final Weight","State/UT","Quarter","Visit","First Stage Unit (FSU)"]},flush=True)
          PY
