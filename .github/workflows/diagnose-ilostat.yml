name: Diagnose ILOSTAT data endpoints
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'httpx>=0.27,<1'
      - name: Probe official ILOSTAT catalogue and data URLs (read only)
        run: python -m app.ilostat_probe
      - name: Preserve diagnostic JSON even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilostat-endpoint-diagnostic
          path: ilostat_probe_results.json
          if-no-files-found: ignore
