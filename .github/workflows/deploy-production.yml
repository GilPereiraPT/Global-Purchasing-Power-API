name: Deploy production API

on:
  workflow_run:
    workflows: ["API tests"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: earnwage-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.EARNWAGE_DEPLOY_ENABLED == 'true' &&
        github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'GilPereiraPT/Global-Purchasing-Power-API'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ROOT: /home3/policli1/api-earnwage
      API_HEALTH_URL: https://earnwage-api.policlinicosdesantoandre.com/v1/health

    steps:
      - name: Resolve tested commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 1

      - name: Validate deployment secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.EARNWAGE_SSH_HOST }}
          SSH_USER: ${{ secrets.EARNWAGE_SSH_USER }}
          SSH_PORT: ${{ secrets.EARNWAGE_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.EARNWAGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EARNWAGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "::error::Missing EARNWAGE_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing EARNWAGE_SSH_USER"; exit 1; }
          test -n "$SSH_PORT" || { echo "::error::Missing EARNWAGE_SSH_PORT"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing EARNWAGE_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Missing EARNWAGE_SSH_KNOWN_HOSTS"; exit 1; }

      - name: Build allow-listed runtime bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.deploy_runtime build --root . --archive /tmp/earnwage-runtime.tgz --commit "$TESTED_SHA"

          EXPECTED_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/native_wsgi.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit("VERSION not found in app/native_wsgi.py")
          print(match.group(1))
          PY
          )"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaged tested commit $TESTED_SHA, version $EXPECTED_VERSION"
        env:
          TESTED_SHA: ${{ steps.ref.outputs.sha }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.EARNWAGE_SSH_HOST }}
          SSH_PORT: ${{ secrets.EARNWAGE_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.EARNWAGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EARNWAGE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/earnwage_deploy
          chmod 600 ~/.ssh/earnwage_deploy
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/earnwage_known_hosts
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f ~/.ssh/earnwage_known_hosts >/dev/null || \
            ssh-keygen -F "$SSH_HOST" -f ~/.ssh/earnwage_known_hosts >/dev/null
          chmod 600 ~/.ssh/earnwage_known_hosts

      - name: Upload runtime bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.EARNWAGE_SSH_HOST }}
          SSH_USER: ${{ secrets.EARNWAGE_SSH_USER }}
          SSH_PORT: ${{ secrets.EARNWAGE_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_ARCHIVE=".earnwage-deploy-${{ steps.ref.outputs.sha }}.tgz"
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/earnwage_known_hosts -o BatchMode=yes -P "$SSH_PORT" -i ~/.ssh/earnwage_deploy \
            /tmp/earnwage-runtime.tgz \
            "$SSH_USER@$SSH_HOST:$APP_ROOT/$REMOTE_ARCHIVE"

      - name: Install files and restart Passenger
        shell: bash
        env:
          SSH_HOST: ${{ secrets.EARNWAGE_SSH_HOST }}
          SSH_USER: ${{ secrets.EARNWAGE_SSH_USER }}
          SSH_PORT: ${{ secrets.EARNWAGE_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_ARCHIVE=".earnwage-deploy-${{ steps.ref.outputs.sha }}.tgz"

          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/earnwage_known_hosts -o BatchMode=yes -p "$SSH_PORT" -i ~/.ssh/earnwage_deploy "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' REMOTE_ARCHIVE='$REMOTE_ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"

          test -f "$REMOTE_ARCHIVE"

          INSTALLER="$(mktemp)"
          trap 'rm -f "$INSTALLER"' EXIT
          tar -xOf "$REMOTE_ARCHIVE" scripts/deploy_runtime.py > "$INSTALLER"
          python3 "$INSTALLER" install --root "$APP_ROOT" --archive "$REMOTE_ARCHIVE"
          rm -f "$REMOTE_ARCHIVE"
          REMOTE

      - name: Verify production health and exact commit
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.bundle.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          python -m scripts.verify_release --url "$API_HEALTH_URL" --commit "$EXPECTED_COMMIT" --version "$EXPECTED_VERSION"
