name: Inspect Netherlands CBS occupation wages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-nl-cbs-wages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract CBS 2025 detailed occupation medians
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request
          base="https://datasets.cbs.nl/odata/v1/CBS/86355NED"
          headers={"User-Agent":"EarnWage/1.0"}
          def get_url(url):
              return json.loads(urllib.request.urlopen(
                  urllib.request.Request(url,headers=headers),timeout=45).read())
          jobs=get_url(base+"/BeroepCodes")["value"]
          obs=[]
          url=base+"/Observations?$filter=Perioden%20eq%20%272025JJ00%27"
          while url:
              page=get_url(url)
              obs.extend(page.get("value",[]))
              url=page.get("@odata.nextLink")
          by_key={(r["Beroep"],r["Measure"]):r for r in obs}
          detail=[]
          for job in jobs:
              title=job["Title"]
              if not re.match(r"^\d{4}\s", title):
                  continue
              ident=job["Identifier"]
              workers=by_key.get((ident,"A045285"))
              median=by_key.get((ident,"A043068"))
              detail.append({
                  "identifier":ident,
                  "title":title,
                  "description":job.get("Description",""),
                  "employees_thousand": workers.get("Value") if workers else None,
                  "employees_attr": workers.get("ValueAttribute") if workers else None,
                  "median_gross_hourly_eur": median.get("Value") if median else None,
                  "median_attr": median.get("ValueAttribute") if median else None,
              })
          print("DETAIL_COUNT",len(detail))
          print("PUBLISHED_MEDIANS",sum(r["median_gross_hourly_eur"] is not None for r in detail))
          for row in detail:
              print("ROW",json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
