name: Inspect Netherlands CBS occupation wages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-nl-cbs-wages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official CBS occupation codes and observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base="https://datasets.cbs.nl/odata/v1/CBS/86355NED"
          headers={"User-Agent":"EarnWage/1.0"}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              return json.loads(urllib.request.urlopen(req,timeout=30).read())
          jobs=get("/BeroepCodes")["value"]
          periods=get("/PeriodenCodes")["value"]
          print("JOB_COUNT",len(jobs))
          print("PERIODS",json.dumps(periods,ensure_ascii=False))
          for row in jobs:
              print("JOB",json.dumps(row,ensure_ascii=False,sort_keys=True))
          obs=get("/Observations?$top=40")["value"]
          print("OBS_SAMPLE_COUNT",len(obs))
          for row in obs:
              print("OBS",json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
