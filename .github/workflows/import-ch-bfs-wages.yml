name: Import Swiss FSO ESS wages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ch-bfs-wages.yml'
  schedule:
    - cron: '17 7 1 5 *'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download reviewed historical and regional BFS group context
        run: python -m scripts.ch_bfs_snapshot --originals "$RUNNER_TEMP/bfs-originals"
      - name: Validate downloaded observations
        run: |
          python - <<'PY'
          from app.ch_bfs_wages import load_snapshot
          rows=load_snapshot()
          assert rows, "empty Swiss snapshot"
          assert any(r["percentile"]=="median" for r in rows)
          print("validated",len(rows))
          PY
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-import-ch-bfs-wages
          path: data/ch_bfs_wages.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [import]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-import-ch-bfs-wages
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/ch_bfs_wages.json
