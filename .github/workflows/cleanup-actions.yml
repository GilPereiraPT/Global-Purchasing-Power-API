name: Clean old Actions runs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '3 days ago' +%s)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at] | @tsv' |
          while IFS=$'\t' read -r run_id created_at; do
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Deleting Actions run $run_id from $created_at"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            fi
          done
