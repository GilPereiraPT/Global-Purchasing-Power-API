name: Refresh official ILOSTAT salaries
on:
  push:
    paths:
      - '.github/workflows/refresh-ilostat.yml'
  workflow_dispatch:
    inputs:
      dataset:
        description: "Annual monthly-earnings by occupation and currency indicator from the official ILOSTAT catalogue"
        required: true
        default: "EAR_EMTA_SEX_OCU_CUR_NB_A"
permissions:
  contents: write
concurrency:
  group: ilostat-salary-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Diagnose official ILOSTAT endpoints
        run: |
          python - <<'PY'
          import httpx
          urls = [
            "https://webapps.ilo.org/ilostat-files/WEB_bulk_download/indicator/table_of_contents_en.csv",
            "https://www.ilo.org/ilostat-files/WEB_bulk_download/indicator/table_of_contents_en.csv",
            "https://rplumber.ilo.org/data/indicator?id=EAR_EMTA_SEX_OCU_CUR_NB",
          ]
          for url in urls:
              try:
                  with httpx.Client(timeout=20,follow_redirects=True) as c:
                      with c.stream("GET", url) as r:
                          print(r.status_code, r.headers.get("content-type"), str(r.url), flush=True)
              except Exception as e:
                  print(type(e).__name__, str(e)[:150], flush=True)
          PY
      - name: Validate and import source data
        env:
          GPP_CACHE_DB: ${{ runner.temp }}/gpp_import.sqlite3
          DATASET: ${{ inputs.dataset || 'EAR_EMTA_SEX_OCU_CUR_NB_A' }}
        run: |
          python -m app.ilostat_import --list
          python -m app.ilostat_import --dataset "$DATASET"
          python -m app.ilostat_import --export
          python -m pytest -q
      - name: Commit sourced snapshot
        run: |
          git add data/salaries_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh observed ILOSTAT salary snapshot"
          git push
