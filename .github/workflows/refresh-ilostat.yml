name: Refresh official ILOSTAT salaries
on:
  workflow_dispatch:
    inputs:
      catalogue_only:
        description: "Only list official salary datasets; do not import or commit"
        type: boolean
        default: true
      dataset:
        description: "Annual monthly-earnings by occupation and currency indicator from the official ILOSTAT catalogue"
        required: true
        default: "EAR_EMTA_SEX_OCU_CUR_NB_A"
permissions:
  contents: read
concurrency:
  group: ilostat-salary-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: List current official ILOSTAT salary datasets
        run: python -m app.ilostat_import --list
      - name: Validate and import source data
        if: ${{ inputs.catalogue_only == false }}
        env:
          GPP_CACHE_DB: ${{ runner.temp }}/gpp_import.sqlite3
          DATASET: ${{ inputs.dataset || 'EAR_EMTA_SEX_OCU_CUR_NB_A' }}
        run: |
          python -m app.ilostat_import --dataset "$DATASET"
          python -m app.ilostat_import --export
      - name: Run tests
        run: python -m pytest -q
      - name: Retain validated dataset for explicit review
        if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' && (inputs.catalogue_only == false) }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dataset-refresh-ilostat
          path: data/salaries_snapshot.json
          if-no-files-found: error
          retention-days: 7
  propose-review:
    needs: [import]
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'GilPereiraPT/Global-Purchasing-Power-API' && github.ref == 'refs/heads/main' && (inputs.catalogue_only == false) }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-dataset-refresh-ilostat
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify complete suite against proposed datasets
        run: python -m pytest -q
      - name: Create data-only branch and review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_review_pr.py data/salaries_snapshot.json
